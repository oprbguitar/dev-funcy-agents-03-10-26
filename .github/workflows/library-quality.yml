# Verificación continua de la biblioteca y del sistema de agentes EOS.
# Autoría y dirección: Pierre R. Boss (oprbguitar). Desarrollo asistido por IA.
name: EOS Library Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate documents and source integrity
        run: node scripts/validate-library.mjs
      - name: Test validator with coverage gates
        run: node --test --experimental-test-coverage --test-coverage-include=scripts/validate-library.mjs --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 tests/validate-library.test.mjs
      - name: Test agent installer with coverage gates
        run: node --test --experimental-test-coverage --test-coverage-include=scripts/install-agents.mjs --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 tests/install-agents.test.mjs
      - name: Check patch whitespace
        run: git show --format= --check HEAD
